name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Store, budget and full-stack tests skip without these; CI always runs them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: pitwall
          POSTGRES_DB: pitwall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pitwall" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PITWALL_TEST_DATABASE_URL: postgres://pitwall:pitwall@localhost:5432/pitwall_test?sslmode=disable
      PITWALL_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # Drive the real gateway with the official OpenAI and Anthropic SDKs.
  sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install openai anthropic
      - run: make build
      - name: Start mock provider and gateway
        run: |
          bin/mockprovider & bin/gateway &
          for i in $(seq 1 50); do curl -sf localhost:8080/healthz && break; sleep 0.2; done
      - run: python scripts/sdk_smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - run: docker build -t pitwall:ci .
