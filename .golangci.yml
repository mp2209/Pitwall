version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - usestdlibvars
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers close bodies via t.Cleanup, and literal status codes
      # read better in assertions.
      - path: _test\.go
        linters: [bodyclose, usestdlibvars]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mp2209/pitwall
