# Pitwall gateway config.
#
# Provider keys are read from the environment variables named in
# api_key_env and never written here. base_url_env lets Docker Compose point
# the same file at service hostnames.

listen: ":8080"

# Without a database (PITWALL_DATABASE_URL unset), this list is the only
# auth: callers must send one of these keys, or anyone may call if it is
# empty (local use only). With a database, per-developer virtual keys from
# the admin API replace it.
dev_keys: []

# Used when an OpenAI-format request without max_tokens goes to an
# Anthropic-format provider, which requires the field, and as the output
# worst case when reserving budget for a request that sets no limit.
default_max_tokens: 8192

# Price table, relative to this file. See prices.yaml for sources.
prices_file: prices.yaml

# If Redis is unreachable, let calls through (and log it) rather than
# refusing every call. Set false to fail closed.
budget_fail_open: true

# Calls without an x-pitwall-task header are grouped into tasks by inference;
# a task closes after this long without a call.
task_idle_gap: 5m

# Prometheus metrics, on their own port so they stay off the public one.
# Set to "" to turn them off.
metrics_listen: ":9464"

# The prompt-cache optimizer adds cache_control breakpoints to Anthropic
# requests that have none. With keys it is switched per key
# (cache_optimizer_on); this default applies in dev mode, without keys.
cache_optimizer_default: false

# Runaway-agent guard. Each signal warns (x-pitwall-warning header) at
# `warn` and refuses the call at `stop`; 0 turns a step off.
guard:
  enabled: true
  repeated_exchange: {warn: 3, stop: 5}          # same step, same result, in a row
  repeated_tool_call: {warn: 6, stop: 10}        # same call and arguments, any result
  context_tokens: {warn: 200000, stop: 500000}   # estimated prompt size
  task_cost_usd: {warn: 8, stop: 10}             # the task's cost so far

providers:
  - name: openai
    kind: openai
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens

  - name: anthropic
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY

  # Ollama's OpenAI-compatible endpoint; no key needed.
  - name: ollama
    kind: openai
    base_url: http://localhost:11434
    base_url_env: OLLAMA_BASE_URL
    free: true                 # local models are recorded at $0

  # The mock provider serves both formats on one port.
  - name: mock-openai
    kind: openai
    base_url: http://localhost:9000
    base_url_env: MOCK_BASE_URL
  - name: mock-anthropic
    kind: anthropic
    base_url: http://localhost:9000
    base_url_env: MOCK_BASE_URL

# Routing rules, first match wins. match uses path.Match globs.
models:
  - match: mock-gpt
    provider: mock-openai
  - match: mock-claude
    provider: mock-anthropic

  - match: "claude-*"
    provider: anthropic

  - match: "gpt-*"
    provider: openai
  - match: "o[0-9]*"
    provider: openai

  # Any local model as ollama/<name>, for example ollama/qwen2.5-coder:7b.
  - match: "ollama/*"
    provider: ollama
    strip_prefix: "ollama/"
