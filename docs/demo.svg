<svg xmlns="http://www.w3.org/2000/svg" width="870" height="452" viewBox="0 0 870 452" role="img" aria-label="Pitwall demo: an agent solves a task, the task is priced, a loop is stopped"><style>text { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d7d7d2 } .cmd { fill: #8fd18f } .note { fill: #e0b46b } .scroll { animation: s 27.72s infinite; animation-timing-function: step-end } @keyframes s { 0% { transform: translateY(0) } 63.007% { transform: translateY(-18px) } 64.319% { transform: translateY(-36px) } 65.582% { transform: translateY(-54px) } 66.861% { transform: translateY(-72px) } 68.135% { transform: translateY(-90px) } 69.410% { transform: translateY(-108px) } 70.691% { transform: translateY(-126px) } 71.969% { transform: translateY(-144px) } 73.248% { transform: translateY(-162px) } 74.522% { transform: translateY(-180px) } 75.811% { transform: translateY(-198px) } 77.081% { transform: translateY(-216px) } 78.357% { transform: translateY(-234px) } 100% { transform: translateY(-234px) } }@keyframes l0 { 0%, 0.014% { opacity: 0 } 0.050%, 100% { opacity: 1 } } .l0 { animation: l0 27.72s infinite }@keyframes l1 { 0%, 1.292% { opacity: 0 } 1.328%, 100% { opacity: 1 } } .l1 { animation: l1 27.72s infinite }@keyframes l2 { 0%, 2.571% { opacity: 0 } 2.607%, 100% { opacity: 1 } } .l2 { animation: l2 27.72s infinite }@keyframes l3 { 0%, 3.849% { opacity: 0 } 3.885%, 100% { opacity: 1 } } .l3 { animation: l3 27.72s infinite }@keyframes l4 { 0%, 5.119% { opacity: 0 } 5.155%, 100% { opacity: 1 } } .l4 { animation: l4 27.72s infinite }@keyframes l5 { 0%, 6.400% { opacity: 0 } 6.436%, 100% { opacity: 1 } } .l5 { animation: l5 27.72s infinite }@keyframes l6 { 0%, 7.675% { opacity: 0 } 7.711%, 100% { opacity: 1 } } .l6 { animation: l6 27.72s infinite }@keyframes l7 { 0%, 39.442% { opacity: 0 } 39.478%, 100% { opacity: 1 } } .l7 { animation: l7 27.72s infinite }@keyframes l8 { 0%, 40.719% { opacity: 0 } 40.755%, 100% { opacity: 1 } } .l8 { animation: l8 27.72s infinite }@keyframes l9 { 0%, 41.994% { opacity: 0 } 42.031%, 100% { opacity: 1 } } .l9 { animation: l9 27.72s infinite }@keyframes l10 { 0%, 43.291% { opacity: 0 } 43.327%, 100% { opacity: 1 } } .l10 { animation: l10 27.72s infinite }@keyframes l11 { 0%, 44.572% { opacity: 0 } 44.608%, 100% { opacity: 1 } } .l11 { animation: l11 27.72s infinite }@keyframes l12 { 0%, 45.839% { opacity: 0 } 45.875%, 100% { opacity: 1 } } .l12 { animation: l12 27.72s infinite }@keyframes l13 { 0%, 47.120% { opacity: 0 } 47.156%, 100% { opacity: 1 } } .l13 { animation: l13 27.72s infinite }@keyframes l14 { 0%, 48.390% { opacity: 0 } 48.426%, 100% { opacity: 1 } } .l14 { animation: l14 27.72s infinite }@keyframes l15 { 0%, 49.664% { opacity: 0 } 49.700%, 100% { opacity: 1 } } .l15 { animation: l15 27.72s infinite }@keyframes l16 { 0%, 50.932% { opacity: 0 } 50.968%, 100% { opacity: 1 } } .l16 { animation: l16 27.72s infinite }@keyframes l17 { 0%, 52.197% { opacity: 0 } 52.233%, 100% { opacity: 1 } } .l17 { animation: l17 27.72s infinite }@keyframes l18 { 0%, 53.476% { opacity: 0 } 53.512%, 100% { opacity: 1 } } .l18 { animation: l18 27.72s infinite }@keyframes l19 { 0%, 59.131% { opacity: 0 } 59.167%, 100% { opacity: 1 } } .l19 { animation: l19 27.72s infinite }@keyframes l20 { 0%, 60.412% { opacity: 0 } 60.448%, 100% { opacity: 1 } } .l20 { animation: l20 27.72s infinite }@keyframes l21 { 0%, 61.693% { opacity: 0 } 61.729%, 100% { opacity: 1 } } .l21 { animation: l21 27.72s infinite }@keyframes l22 { 0%, 62.971% { opacity: 0 } 63.007%, 100% { opacity: 1 } } .l22 { animation: l22 27.72s infinite }@keyframes l23 { 0%, 64.283% { opacity: 0 } 64.319%, 100% { opacity: 1 } } .l23 { animation: l23 27.72s infinite }@keyframes l24 { 0%, 65.546% { opacity: 0 } 65.582%, 100% { opacity: 1 } } .l24 { animation: l24 27.72s infinite }@keyframes l25 { 0%, 66.824% { opacity: 0 } 66.861%, 100% { opacity: 1 } } .l25 { animation: l25 27.72s infinite }@keyframes l26 { 0%, 68.098% { opacity: 0 } 68.135%, 100% { opacity: 1 } } .l26 { animation: l26 27.72s infinite }@keyframes l27 { 0%, 69.374% { opacity: 0 } 69.410%, 100% { opacity: 1 } } .l27 { animation: l27 27.72s infinite }@keyframes l28 { 0%, 70.655% { opacity: 0 } 70.691%, 100% { opacity: 1 } } .l28 { animation: l28 27.72s infinite }@keyframes l29 { 0%, 71.933% { opacity: 0 } 71.969%, 100% { opacity: 1 } } .l29 { animation: l29 27.72s infinite }@keyframes l30 { 0%, 73.212% { opacity: 0 } 73.248%, 100% { opacity: 1 } } .l30 { animation: l30 27.72s infinite }@keyframes l31 { 0%, 74.486% { opacity: 0 } 74.522%, 100% { opacity: 1 } } .l31 { animation: l31 27.72s infinite }@keyframes l32 { 0%, 75.775% { opacity: 0 } 75.811%, 100% { opacity: 1 } } .l32 { animation: l32 27.72s infinite }@keyframes l33 { 0%, 77.045% { opacity: 0 } 77.081%, 100% { opacity: 1 } } .l33 { animation: l33 27.72s infinite }@keyframes l34 { 0%, 78.321% { opacity: 0 } 78.357%, 100% { opacity: 1 } } .l34 { animation: l34 27.72s infinite }</style><rect width="870" height="452" rx="10" fill="#1c1c1b"/><circle cx="18" cy="15" r="5" fill="#e5534b"/><circle cx="34" cy="15" r="5" fill="#d29922"/><circle cx="50" cy="15" r="5" fill="#57ab5a"/><clipPath id="v"><rect x="0" y="28" width="870" height="424"/></clipPath><g clip-path="url(#v)"><g class="scroll"><text class="note l0" x="14" y="55" xml:space="preserve"># Pitwall sits between coding agents and model providers.</text><text class="note l1" x="14" y="73" xml:space="preserve"># 1. An agent fixes a failing test through it, on claude-haiku-5-5.</text><text class="cmd l2" x="14" y="91" xml:space="preserve">$ cat bench/tasks/006-semver-compare/TASK.md | head -3</text><text class="out l3" x="14" y="109" xml:space="preserve">  `Compare` in semver.go should order semantic versions the way the SemVer</text><text class="out l4" x="14" y="127" xml:space="preserve">  spec does: major, minor and patch compare as numbers (1.10.0 is after</text><text class="out l5" x="14" y="145" xml:space="preserve">  1.9.0), a leading "v" is ignored, and a pre-release ("1.0.0-beta.2") comes</text><text class="cmd l6" x="14" y="163" xml:space="preserve">$ bin/agent -model claude-haiku-5-5 -dir 006-semver-compare -task demo-006-semver-compare-035939</text><text class="out l7" x="14" y="181" xml:space="preserve">  solved in 5 calls, 8.4s   x-pitwall-task-id: t_48f8e37f1b76e6f8b033</text><text class="note l8" x="14" y="199" xml:space="preserve"># 2. Pitwall grouped those calls into one task and priced it.</text><text class="cmd l9" x="14" y="217" xml:space="preserve">$ curl $PITWALL/admin/tasks/t_48f8e37f1b76e6f8b033</text><text class="out l10" x="14" y="235" xml:space="preserve">  outcome solved  calls 5  cost $0.0013  context 979 -&gt; 3773 tokens  repeated input 63%</text><text class="out l11" x="14" y="253" xml:space="preserve">  call  prompt  cached  output     cost  guard</text><text class="out l12" x="14" y="271" xml:space="preserve">     1     979       0      73  $0.0001  </text><text class="out l13" x="14" y="289" xml:space="preserve">     2    1221    1219     100  $0.0001  </text><text class="out l14" x="14" y="307" xml:space="preserve">     3    2076    2074    1375  $0.0007  </text><text class="out l15" x="14" y="325" xml:space="preserve">     4    3471    2074     221  $0.0003  </text><text class="out l16" x="14" y="343" xml:space="preserve">     5    3773    3469      76  $0.0001  </text><text class="note l17" x="14" y="361" xml:space="preserve"># 3. A seeded loop: the agent runs the same failing test, again and again.</text><text class="cmd l18" x="14" y="379" xml:space="preserve">$ bin/agent -model mock-claude -dir 006-semver-compare -task demo-loop-035939   # mock: loops on purpose</text><text class="out l19" x="14" y="397" xml:space="preserve">  stopped after 6 calls</text><text class="out l20" x="14" y="415" xml:space="preserve">  Pitwall stopped this call: the agent repeated the same step 5 times in a row with the same</text><text class="out l21" x="14" y="433" xml:space="preserve">  result (run_tests {}). This looks like a runaway agent. Change the approach, or ask a Pitwall</text><text class="out l22" x="14" y="451" xml:space="preserve">  admin to raise the guard limits.</text><text class="out l23" x="14" y="469" xml:space="preserve">  call  prompt  cached  output     cost  guard</text><text class="out l24" x="14" y="487" xml:space="preserve">     1     343       0       3  $0.0011  </text><text class="out l25" x="14" y="505" xml:space="preserve">     2     581       0       3  $0.0018  </text><text class="out l26" x="14" y="523" xml:space="preserve">     3     820       0       3  $0.0025  </text><text class="out l27" x="14" y="541" xml:space="preserve">     4    1058       0       3  $0.0040  repeated_exchange:warn</text><text class="out l28" x="14" y="559" xml:space="preserve">     5    1297    1058       3  $0.0013  repeated_exchange:warn</text><text class="out l29" x="14" y="577" xml:space="preserve">     6       -       -       -        -  repeated_exchange:stop  (refused, status 400)</text><text class="note l30" x="14" y="595" xml:space="preserve"># 4. Both runs, as tasks: what each one cost and how it ended.</text><text class="cmd l31" x="14" y="613" xml:space="preserve">$ curl "$PITWALL/admin/tasks?key_id=21"</text><text class="out l32" x="14" y="631" xml:space="preserve">  demo-loop-035939                   stopped   6 calls  $0.0106  guard events 3</text><text class="out l33" x="14" y="649" xml:space="preserve">  demo-006-semver-compare-035939     solved    5 calls  $0.0013  guard events 0</text><text class="note l34" x="14" y="667" xml:space="preserve"># The same tasks are in Grafana (localhost:3001) and Langfuse (localhost:3000).</text></g></g></svg>
